[project]
name = "emp"
version = "0.1.0"
description = "Python test"
authors = [
    {name = "ibctec",email = "ikenna.ibeanu@ibctec.co.uk"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.115.12,<0.116.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "sqlalchemy-orm (>=1.2.10,<2.0.0)",
    "sqlalchemy (>=2.0.40,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.11.1,<3.0.0)",
    "email-validator (>=2.2.0,<3.0.0)"
]
packages = [{include = "emp"}]

[tool.project]
name = "emp"
version = "0.1.0"
description = "Python test"
authors = [
    {name = "ibctec",email = "ikenna.ibeanu@ibctec.co.uk"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.115.12,<0.116.0)",
    "uvicorn (>=0.34.0,<0.35.0)"
]
packages = [{include = "emp"}] 

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
black = "^25.1.0"
flake8 = "^7.2.0"

